[package]
name = "rustts_macros"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
description = "Derive macros for RustTS TypeScript schemas"
repository = "https://github.com/Glubus/Rust-TS"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.46"
syn = { version = "2.0.118", features = ["full"] }
